version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: lt-postgres
    environment:
      POSTGRES_DB: learning_tree_db
      POSTGRES_USER: lt_admin
      POSTGRES_PASSWORD: ${DB_PASSWORD:-securepassword123}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: lt-redis
    ports:
      - "6379:6379"
    restart: unless-stopped

  backend:
    build: ./backend
    container_name: lt-backend
    ports:
      - "3001:3001"
    environment:
      DATABASE_URL: postgresql://lt_admin:${DB_PASSWORD:-securepassword123}@postgres:5432/learning_tree_db?schema=public
      JWT_SECRET: ${JWT_SECRET:-your_jwt_secret_here}
      JWT_EXPIRATION: 7d
      REDIS_URL: redis://redis:6379
      PORT: 3001
    depends_on:
      - postgres
      - redis
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: lt-frontend
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://backend:3001/api/v1
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
